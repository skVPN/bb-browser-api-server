[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
user=root

[program:xvfb]
command=/usr/bin/Xvfb :99 -screen 0 1920x1080x24
autostart=true
autorestart=true
priority=10
stdout_logfile=/var/log/supervisor/xvfb.log
stderr_logfile=/var/log/supervisor/xvfb_err.log
environment=DISPLAY=":99",LANG="zh_CN.UTF-8",LC_ALL="zh_CN.UTF-8"

[program:fluxbox]
command=/usr/bin/fluxbox
autostart=true
autorestart=true
priority=20
stdout_logfile=/var/log/supervisor/fluxbox.log
stderr_logfile=/var/log/supervisor/fluxbox_err.log
environment=DISPLAY=":99"
startsecs=3

[program:x11vnc]
command=/usr/bin/x11vnc -display :99 -forever -shared -nopw -rfbport 5900 -listen 0.0.0.0
autostart=true
autorestart=true
priority=30
stdout_logfile=/var/log/supervisor/x11vnc.log
stderr_logfile=/var/log/supervisor/x11vnc_err.log
environment=DISPLAY=":99"
startsecs=3

[program:websockify]
command=/bin/bash -c 'mkdir -p /etc/novnc && echo "${NOVNC_TOKEN:-tec}: localhost:5900" > /etc/novnc/tokenfile && websockify --web=/usr/share/novnc --token-plugin=TokenFile --token-source=/etc/novnc/tokenfile 6080'
autostart=true
autorestart=true
priority=40
stdout_logfile=/var/log/supervisor/websockify.log
stderr_logfile=/var/log/supervisor/websockify_err.log
startsecs=3

[program:bb-browser-api]
command=/bin/bash -c 'if [ -d /root/.bb-browser/browser/user-data ]; then rm -f /root/.bb-browser/browser/user-data/Singleton* || true; fi && bb-browser-api daemon start && tail -f /dev/null'
autostart=true
autorestart=true
priority=50
stdout_logfile=/var/log/supervisor/bb-browser-api.log
stderr_logfile=/var/log/supervisor/bb-browser-api_err.log
environment=DISPLAY=":99",LANG="zh_CN.UTF-8",LC_ALL="zh_CN.UTF-8"
startsecs=5
